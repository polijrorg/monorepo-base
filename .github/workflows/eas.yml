name: Mobile (EAS)

# Fluxo (detalhes em mobile/docs/DEPLOY.md, seção 11):
# - PR pra dev/main mexendo no mobile → valida (config, lint, typecheck, bundle). Não usa EAS.
# - push na dev  → EAS Update no channel "preview"    (builds de preview recebem o JS novo)
# - push na main → EAS Update no channel "production" (apps da loja recebem o JS novo)
# - disparo manual → EAS Build (+ envio pras lojas, opcional)
# Com runtimeVersion "fingerprint", update que depende de mudança nativa não chega em build antigo.

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'mobile/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/eas.yml'

  push:
    branches: [dev, main]
    paths:
      - 'mobile/**'

  workflow_dispatch:
    inputs:
      platform:
        description: 'Plataforma'
        type: choice
        options: [all, android, ios]
        default: all
      profile:
        description: 'Profile do eas.json'
        type: choice
        options: [preview, production]
        default: preview
      submit:
        description: 'Enviar pras lojas quando o build terminar (só com profile production)'
        type: boolean
        default: false

jobs:
  validate:
    name: Validar mobile
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validar config do Expo
        run: npx expo config --type public > /dev/null

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Bundle JS (Android e iOS)
        run: npx expo export --platform android --platform ios --output-dir "$RUNNER_TEMP/expo-export"

  update:
    name: EAS Update
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: eas-update-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Verificar EXPO_TOKEN
        if: env.EXPO_TOKEN == ''
        working-directory: .
        run: |
          echo "::error::Secret EXPO_TOKEN não configurado. Veja mobile/docs/DEPLOY.md, seção 11."
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # main → production, dev → preview. O --environment é obrigatório no SDK 55+:
      # sem ele o update sai sem as variáveis EXPO_PUBLIC_* do EAS (e no CI o eas-cli não avisa).
      - name: Publicar update
        env:
          TARGET: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          eas update \
            --channel "$TARGET" \
            --environment "$TARGET" \
            --message "${COMMIT_MESSAGE%%$'\n'*}" \
            --non-interactive

  build:
    name: EAS Build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Verificar EXPO_TOKEN
        if: env.EXPO_TOKEN == ''
        working-directory: .
        run: |
          echo "::error::Secret EXPO_TOKEN não configurado. Veja mobile/docs/DEPLOY.md, seção 11."
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --no-wait: o job termina logo e o build segue na nuvem da Expo (acompanhe em expo.dev).
      # --auto-submit: o próprio EAS envia pras lojas quando o build terminar.
      - name: Build
        env:
          PLATFORM: ${{ inputs.platform }}
          PROFILE: ${{ inputs.profile }}
          SUBMIT: ${{ inputs.submit && inputs.profile == 'production' && '--auto-submit' || '' }}
        run: eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --no-wait $SUBMIT
