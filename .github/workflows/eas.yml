name: Deploy Mobile App

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'pnpm-lock.yaml'

  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'

  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (ios, android, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - ios
          - android
          - all
      submit:
        description: 'Submit to stores after build'
        required: true
        default: false
        type: boolean

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  # Preview build for PRs — uses EAS preview profile, does not submit to stores
  preview:
    name: Preview Build (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Android credentials
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > mobile/google-services.json

      - name: Validate Expo config
        working-directory: mobile
        run: npx expo config --type public

      - name: Build preview (all platforms)
        working-directory: mobile
        run: eas build --platform all --profile preview --non-interactive --no-wait

      - name: Comment PR with EAS dashboard link
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📱 **Preview build triggered on EAS.**\n\nCheck the [Expo dashboard](https://expo.dev/accounts/${{ secrets.EXPO_ACCOUNT_NAME }}/projects) for download links once the build completes.\n\n> Build profile: \`preview\` — not submitted to stores.`
            })

  # Production build + OTA update + store submission on push to main
  production:
    name: Production Build & Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Credentials must be set up BEFORE the build steps
      - name: Setup Android credentials
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > mobile/google-services.json

      - name: Validate Expo config
        working-directory: mobile
        run: npx expo config --type public

      - name: Build iOS (Production)
        working-directory: mobile
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' &&
           (github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all'))
        run: eas build --platform ios --profile production --non-interactive --wait

      - name: Build Android (Production)
        working-directory: mobile
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' &&
           (github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all'))
        run: eas build --platform android --profile production --non-interactive --wait

      # OTA only runs when all requested platforms were built (push = all; dispatch only when platform == all)
      - name: Deploy OTA Update (production)
        working-directory: mobile
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.platform == 'all')
        run: eas update --branch production --message "Deploy from ${{ github.sha }}"

      - name: Deploy OTA Update (preview)
        working-directory: mobile
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.platform == 'all')
        run: eas update --branch preview --message "Deploy from ${{ github.sha }}" || echo "Preview branch not configured, skipping"

      # Submit requires explicit opt-in via workflow_dispatch and the correct platform selection
      - name: Submit iOS to App Store
        working-directory: mobile
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.submit == 'true' &&
          (github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all')
        run: eas submit --platform ios --latest --non-interactive

      - name: Submit Android to Play Store
        working-directory: mobile
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.submit == 'true' &&
          (github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all')
        run: eas submit --platform android --latest --non-interactive
